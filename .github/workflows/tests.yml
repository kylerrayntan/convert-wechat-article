name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            node: '22'
          - os: macos-latest
            python: '3.12'
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: convert-wechat-article/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix convert-wechat-article --ignore-scripts --no-audit --no-fund
      - name: Run synthetic regression and clipboard unit tests
        run: python tests/run_checks.py
